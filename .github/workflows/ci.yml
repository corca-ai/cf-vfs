name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      # Structural cost — statements and rows read — is a correctness-shaped
      # property, and it drifted unnoticed for fifty-six commits while this ran
      # only on a weekly schedule. It takes about five seconds.
      - run: npm run bench:check
